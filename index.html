<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>积木库 · meark-blocks</title>
    <meta name="description" content="把想要的效果翻译成 AI 能准确执行的规格。" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23F6F4EF'/%3E%3Crect x='12' y='12' width='16' height='16' rx='4' fill='%233C6E7B'/%3E%3Crect x='36' y='36' width='16' height='16' rx='4' fill='%233C6E7B'/%3E%3C/svg%3E"
    />
    <script>
      // 默认浅色；仅在用户显式切到深色时提前设置，避免首屏闪烁
      try {
        if (localStorage.getItem('meark-theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark'
          document.documentElement.style.colorScheme = 'dark'
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
