name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 生成 catalog.json 并复制 demo（同时做通用层禁词校验，不通过则构建失败）
      - run: npm run catalog

      # 绑定自定义域名 blocks.meark.cn 时 base 取根路径。
      # 若先用 <user>.github.io/<repo>/ 访问，改成 /${{ github.event.repository.name }}/
      - name: Build
        run: npx vite build
        env:
          VITE_BASE: /

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
