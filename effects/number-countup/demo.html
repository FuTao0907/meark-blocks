<!doctype html>
<html lang="zh-CN">
<head>
<script>
  // 演示模式：?motion=1 时忽略系统「减少动态效果」，方便查看完整效果；默认遵循系统设置
  (function () {
    var force = new URLSearchParams(location.search).get('motion') === '1'
    if (!force) return
    document.documentElement.classList.add('motion-force')
    var nativeMatchMedia = window.matchMedia.bind(window)
    window.matchMedia = function (query) {
      if (/prefers-reduced-motion/.test(query)) {
        return {
          matches: false,
          media: query,
          onchange: null,
          addEventListener: function () {},
          removeEventListener: function () {},
          addListener: function () {},
          removeListener: function () {},
          dispatchEvent: function () { return false }
        }
      }
      return nativeMatchMedia(query)
    }
  })()
</script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../shared/base.css" />
<title>数字增长 · demo</title>
<style>
  
  * { box-sizing: border-box; }body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 48px 20px;
}
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 200px)); gap: 18px; }
  @media (max-width: 720px) { .stats { grid-template-columns: 1fr; } }

  .stat-toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
    width: min(636px, 100%);
    margin-bottom: 14px;
  }
  .stat-hint { margin: 0; font-size: 12.5px; color: var(--muted); }
  .stat-replay {
    padding: 7px 14px;
    border: 1px solid rgba(94, 234, 212, 0.45);
    border-radius: 999px;
    background: rgba(94, 234, 212, 0.1);
    color: var(--accent);
    font-size: 12.5px;
    cursor: pointer;
  }
  .stat-replay:hover { background: rgba(94, 234, 212, 0.18); }

  .stat {
    padding: 24px 20px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--card);
  }
  .stat__value {
    display: block;
    min-width: 6ch;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -0.5px;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
  }
  .stat__label { display: block; margin-top: 8px; font-size: 13px; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {html:not(.motion-force) .stat__value { transition: none; }
  }
</style>
</head>
<body>
  <div class="stat-toolbar">
    <p class="stat-hint">首次进入视口时，数字从 0 增长到目标值；想再看一次就点右侧按钮。</p>
    <button class="stat-replay" type="button">重新播放</button>
  </div>

  <div class="stats">
    <div class="stat">
      <span class="stat__value" data-to="12800" data-suffix="+">0</span>
      <span class="stat__label">累计构建次数</span>
    </div>
    <div class="stat">
      <span class="stat__value" data-to="99.2" data-decimals="1" data-suffix="%">0</span>
      <span class="stat__label">可用性</span>
    </div>
    <div class="stat">
      <span class="stat__value" data-to="37" data-suffix=" 天">0</span>
      <span class="stat__label">平均交付周期</span>
    </div>
  </div>

<script>
(() => {
  const nf = new Intl.NumberFormat('zh-CN')
  const values = Array.from(document.querySelectorAll('.stat__value'))
  const replayBtn = document.querySelector('.stat-replay')
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches
  let rafIds = []

  const format = (n, decimals) => {
    const fixed = n.toFixed(decimals)
    const [int, dec] = fixed.split('.')
    return nf.format(Number(int)) + (dec ? '.' + dec : '')
  }

  const run = (el) => {
    const to = Number(el.dataset.to || 0)
    const decimals = Number(el.dataset.decimals || 0)
    const suffix = el.dataset.suffix || ''
    const duration = Number(el.dataset.duration || 1200)

    if (reduce) {
      el.textContent = format(to, decimals) + suffix
      return
    }

    const start = performance.now()
    const step = (now) => {
      const p = Math.min(1, (now - start) / duration)
      const eased = 1 - Math.pow(1 - p, 3)
      el.textContent = format(to * eased, decimals) + suffix
      if (p < 1) rafIds.push(requestAnimationFrame(step))
      else el.textContent = format(to, decimals) + suffix
    }
    rafIds.push(requestAnimationFrame(step))
  }

  const runAll = () => {
    rafIds.forEach((id) => cancelAnimationFrame(id))
    rafIds = []
    values.forEach((el) => { el.textContent = '0' })
    values.forEach((el, i) => {
      setTimeout(() => run(el), i * 90)
    })
  }

  if (!('IntersectionObserver' in window) || reduce) {
    values.forEach(run)
  } else {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (!entry.isIntersecting) return
        // 稍作延迟，避免一打开就已经播完、用户看不到过程
        setTimeout(() => run(entry.target), 500)
        io.unobserve(entry.target)
      })
    }, { threshold: 0.3 })
    values.forEach((el) => io.observe(el))
  }

  replayBtn.addEventListener('click', runAll)
})()
</script>
</body>
</html>
