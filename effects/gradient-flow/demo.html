<!doctype html>
<html lang="zh-CN">
<head>
<script>
  // 演示模式：?motion=1 时忽略系统「减少动态效果」，方便查看完整效果；默认遵循系统设置
  (function () {
    var force = new URLSearchParams(location.search).get('motion') === '1'
    if (!force) return
    document.documentElement.classList.add('motion-force')
    var nativeMatchMedia = window.matchMedia.bind(window)
    window.matchMedia = function (query) {
      if (/prefers-reduced-motion/.test(query)) {
        return {
          matches: false,
          media: query,
          onchange: null,
          addEventListener: function () {},
          removeEventListener: function () {},
          addListener: function () {},
          removeListener: function () {},
          dispatchEvent: function () { return false }
        }
      }
      return nativeMatchMedia(query)
    }
  })()
</script>
<style>
  /* 统一的自绘滚动条，避免系统默认样式破坏深色版式 */
  * { scrollbar-width: thin; scrollbar-color: #2b3a5c transparent; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    border: 2px solid transparent;
    border-radius: 999px;
    background: #2b3a5c;
    background-clip: content-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: #3a4d78; background-clip: content-box; }
</style>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>渐变流动背景 · demo</title>
<style>
  :root {
    --bg: #0b1020;
    --card: #141a2e;
    --line: #22304d;
    --text: #e6ebf5;
    --muted: #8d9ab5;
    --accent: #5eead4;

    /* 参数默认值，与 meta.json 一致 */
    --speed: 12s;
    --angle: 135deg;
    --intensity: 0.55;
  }

  * { box-sizing: border-box; }

  html, body { min-height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- 背景层 ---------- */
  .flow {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    background: #0b1020;
  }

  .flow__base {
    position: absolute;
    inset: -38%;
    background: linear-gradient(var(--angle),
      #0b1020 0%,
      #13304a 20%,
      #1e2a5c 42%,
      #3a2352 60%,
      #0f3a44 78%,
      #0b1020 100%);
    animation: baseDrift var(--speed) ease-in-out infinite;
    will-change: transform;
  }

  .flow__glow {
    position: absolute;
    inset: 0;
    opacity: var(--intensity);
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    will-change: transform;
  }
  .blob--a {
    left: -20vmax;
    top: -30vmax;
    width: 82vmax;
    height: 82vmax;
    background: radial-gradient(circle, rgba(94, 234, 212, 0.42) 0%, rgba(94, 234, 212, 0.12) 40%, rgba(94, 234, 212, 0) 68%);
    animation: driftA var(--speed) ease-in-out infinite;
  }
  .blob--b {
    right: -24vmax;
    bottom: -30vmax;
    width: 74vmax;
    height: 74vmax;
    background: radial-gradient(circle, rgba(96, 165, 250, 0.4) 0%, rgba(96, 165, 250, 0.11) 42%, rgba(96, 165, 250, 0) 70%);
    animation: driftB calc(var(--speed) * 1.35) ease-in-out infinite;
  }
  .blob--c {
    left: 26%;
    top: 12%;
    width: 62vmax;
    height: 62vmax;
    background: radial-gradient(circle, rgba(167, 139, 250, 0.34) 0%, rgba(167, 139, 250, 0.09) 44%, rgba(167, 139, 250, 0) 72%);
    animation: driftC calc(var(--speed) * 0.72) ease-in-out infinite;
  }

  .flow__sheen {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 170vmax;
    height: 170vmax;
    margin: -85vmax 0 0 -85vmax;
    background: conic-gradient(from var(--angle),
      rgba(94, 234, 212, 0) 0deg,
      rgba(94, 234, 212, 0.09) 45deg,
      rgba(94, 234, 212, 0) 130deg,
      rgba(125, 211, 252, 0.08) 205deg,
      rgba(94, 234, 212, 0) 268deg,
      rgba(167, 139, 250, 0.09) 320deg,
      rgba(94, 234, 212, 0) 360deg);
    animation: spin calc(var(--speed) * 4) linear infinite;
    will-change: transform;
  }

  .flow__shade {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(68% 52% at 50% 40%, rgba(11, 16, 32, 0.78) 0%, rgba(11, 16, 32, 0.42) 48%, rgba(11, 16, 32, 0) 74%),
      linear-gradient(180deg, rgba(11, 16, 32, 0.5) 0%, rgba(11, 16, 32, 0.18) 45%, rgba(11, 16, 32, 0.88) 100%);
  }

  @keyframes baseDrift {
    0%, 100% { transform: translate3d(-3%, -2%, 0) scale(1.06); }
    50% { transform: translate3d(3%, 3%, 0) scale(1.16); }
  }
  @keyframes driftA {
    0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
    50% { transform: translate3d(9vmax, 7vmax, 0) scale(1.12); }
  }
  @keyframes driftB {
    0%, 100% { transform: translate3d(0, 0, 0) scale(1.04); }
    50% { transform: translate3d(-8vmax, -6vmax, 0) scale(0.94); }
  }
  @keyframes driftC {
    0%, 100% { transform: translate3d(0, 0, 0) scale(0.96); }
    33% { transform: translate3d(6vmax, -7vmax, 0) scale(1.1); }
    66% { transform: translate3d(-5vmax, 4vmax, 0) scale(1.02); }
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .paused .flow .flow__base,
  .paused .flow .blob,
  .paused .flow .flow__sheen { animation-play-state: paused; }

  /* ---------- 内容层 ---------- */
  .page {
    position: relative;
    z-index: 1;
    display: grid;
    align-content: center;
    justify-items: center;
    gap: 22px;
    min-height: 100vh;
    padding: 56px 20px;
  }

  .panel {
    width: min(760px, 100%);
    padding: clamp(26px, 4vw, 46px);
    border: 1px solid var(--line);
    border-radius: 22px;
    background: linear-gradient(180deg, rgba(20, 26, 46, 0.82) 0%, rgba(18, 24, 42, 0.9) 100%);
    background-color: var(--card);
    box-shadow: 0 50px 110px -50px rgba(0, 0, 0, 0.95);
    backdrop-filter: blur(14px);
  }

  .tag {
    display: flex;
    width: fit-content;
    align-items: center;
    gap: 8px;
    margin-bottom: 18px;
    font-size: 12px;
    letter-spacing: 0.16em;
    color: var(--muted);
  }
  .tag::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px rgba(94, 234, 212, 0.12);
  }

  h1 {
    margin: 0 0 16px;
    font-size: clamp(30px, 5.4vw, 46px);
    line-height: 1.22;
    letter-spacing: 0.01em;
  }

  .lede {
    margin: 0;
    max-width: 58ch;
    font-size: 15px;
    line-height: 1.95;
    color: var(--muted);
  }
  .lede b { color: var(--text); font-weight: 600; }

  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 28px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
  }
  .stat {
    flex: 1 1 130px;
    padding: 12px 16px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: rgba(11, 16, 32, 0.55);
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--muted);
  }
  .stat b {
    display: block;
    margin-top: 6px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px;
    margin-top: 26px;
  }
  .btn {
    appearance: none;
    cursor: pointer;
    border: 1px solid rgba(94, 234, 212, 0.36);
    border-radius: 999px;
    padding: 9px 20px;
    font: inherit;
    font-size: 13px;
    color: var(--accent);
    background: rgba(94, 234, 212, 0.1);
    transition: background 160ms ease, border-color 160ms ease;
  }
  .btn:hover { background: rgba(94, 234, 212, 0.18); border-color: rgba(94, 234, 212, 0.6); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .actions__hint {
    font-size: 12px;
    line-height: 1.8;
    color: var(--muted);
  }

  .caption {
    width: min(760px, 100%);
    margin: 0;
    font-size: 12px;
    line-height: 1.9;
    color: #93a0ba;
    text-align: center;
  }

  @media (prefers-reduced-motion: reduce) {html:not(.motion-force) .flow__base, html:not(.motion-force) .blob, html:not(.motion-force) .flow__sheen { animation: none !important; }
  }
</style>
</head>
<body>

<div class="flow" aria-hidden="true">
  <div class="flow__base"></div>
  <div class="flow__glow">
    <span class="blob blob--a"></span>
    <span class="blob blob--b"></span>
    <span class="blob blob--c"></span>
  </div>
  <div class="flow__sheen"></div>
  <div class="flow__shade"></div>
</div>

<main class="page">
  <section class="panel">
    <span class="tag">animation / ambient</span>
    <h1>渐变流动背景</h1>
    <p class="lede">底色沿 <b>135°</b> 铺开，三组柔光以 <b>12s</b> 左右的周期各自漂移，强度压到 <b>0.55</b>。整层只做氛围，不承载信息，也不抢正文。</p>
    <div class="stats">
      <div class="stat">循环时长<b>12s</b></div>
      <div class="stat">渐变方向<b>135°</b></div>
      <div class="stat">光晕强度<b>0.55</b></div>
    </div>
    <div class="actions">
      <button class="btn" id="toggle" type="button" aria-pressed="false">暂停动画</button>
      <span class="actions__hint" id="stateHint">正在播放，点击可完全冻住当前帧</span>
    </div>
  </section>

  <p class="caption">背景整层标记为装饰并从读屏中移除；开启系统「减弱动态效果」后自动静止为一帧静态渐变。</p>
</main>

<script>
(() => {
  const root = document.documentElement
  const btn = document.getElementById('toggle')
  const hint = document.getElementById('stateHint')

  const cleanups = []
  const listen = (target, type, handler, options) => {
    target.addEventListener(type, handler, options)
    cleanups.push(() => target.removeEventListener(type, handler, options))
  }

  let userPaused = false

  const render = () => {
    const paused = userPaused || document.hidden
    root.classList.toggle('paused', paused)
    btn.textContent = userPaused ? '继续播放' : '暂停动画'
    btn.setAttribute('aria-pressed', String(userPaused))
    hint.textContent = userPaused
      ? '已冻结在当前帧，继续播放不会回到起点'
      : '正在播放，点击可完全冻住当前帧'
  }

  const toggle = () => {
    userPaused = !userPaused
    render()
  }

  // 标签页切走时自动冻结，回来恢复用户自己的选择
  const onVisibility = () => render()

  listen(btn, 'click', toggle)
  listen(document, 'visibilitychange', onVisibility)

  const dispose = () => {
    cleanups.forEach((fn) => fn())
    cleanups.length = 0
  }
  listen(window, 'pagehide', dispose, { once: true })

  render()
})()
</script>
</body>
</html>
