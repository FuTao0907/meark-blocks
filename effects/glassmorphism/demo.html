<!doctype html>
<html lang="zh-CN">
<head>
<script>
  // 演示模式：?motion=1 时忽略系统「减少动态效果」，方便查看完整效果；默认遵循系统设置
  (function () {
    var force = new URLSearchParams(location.search).get('motion') === '1'
    if (!force) return
    document.documentElement.classList.add('motion-force')
    var nativeMatchMedia = window.matchMedia.bind(window)
    window.matchMedia = function (query) {
      if (/prefers-reduced-motion/.test(query)) {
        return {
          matches: false,
          media: query,
          onchange: null,
          addEventListener: function () {},
          removeEventListener: function () {},
          addListener: function () {},
          removeListener: function () {},
          dispatchEvent: function () { return false }
        }
      }
      return nativeMatchMedia(query)
    }
  })()
</script>
<style>
  /* 统一的自绘滚动条，避免系统默认样式破坏深色版式 */
  * { scrollbar-width: thin; scrollbar-color: #2b3a5c transparent; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    border: 2px solid transparent;
    border-radius: 999px;
    background: #2b3a5c;
    background-clip: content-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: #3a4d78; background-clip: content-box; }
</style>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>玻璃拟态 · demo</title>
<style>
  :root {
    --bg: #0b1020;
    --card: #141a2e;
    --line: #22304d;
    --text: #e6ebf5;
    --muted: #8d9ab5;
    --accent: #5eead4;
    --glass-blur: 16px;
    --glass-alpha: 0.12;
    --glass-radius: 20px;
    --glass-tint: 255, 255, 255;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 44px 20px;
    background: var(--bg);
    color: var(--text);
    font-family: "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    overflow-x: hidden;
  }

  /* 背景光斑：玻璃要模糊的就是它 */
  .aurora {
    position: fixed;
    inset: -14%;
    z-index: 0;
    pointer-events: none;
    transform: translate3d(calc(var(--mx, 0) * 1px), calc(var(--my, 0) * 1px), 0);
    transition: transform .6s cubic-bezier(.22, .7, .3, 1);
  }
  .blob {
    position: absolute;
    display: block;
    border-radius: 50%;
    filter: blur(64px);
    opacity: .6;
  }
  .blob--a {
    width: 44vmax; height: 44vmax;
    left: -8%; top: -14%;
    background: radial-gradient(circle at 35% 35%, #2dd4bf 0%, #0e7490 52%, transparent 72%);
    animation: drift-a 24s ease-in-out infinite alternate;
  }
  .blob--b {
    width: 40vmax; height: 40vmax;
    right: -6%; top: 6%;
    background: radial-gradient(circle at 60% 40%, #6366f1 0%, #4338ca 55%, transparent 74%);
    animation: drift-b 30s ease-in-out infinite alternate;
  }
  .blob--c {
    width: 38vmax; height: 38vmax;
    left: 26%; bottom: -18%;
    background: radial-gradient(circle at 50% 50%, #a855f7 0%, #6d28d9 58%, transparent 78%);
    animation: drift-c 27s ease-in-out infinite alternate;
  }
  /* 中心压暗一层，保证玻璃面板上的浅色文字对比度 */
  .aurora::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(72% 64% at 50% 48%, rgba(11, 16, 32, .62) 0%, rgba(11, 16, 32, .24) 62%, rgba(11, 16, 32, 0) 100%);
  }
  @keyframes drift-a {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to { transform: translate3d(7%, 9%, 0) scale(1.14); }
  }
  @keyframes drift-b {
    from { transform: translate3d(0, 0, 0) scale(1.06); }
    to { transform: translate3d(-9%, 5%, 0) scale(1); }
  }
  @keyframes drift-c {
    from { transform: translate3d(0, 0, 0) scale(.96); }
    to { transform: translate3d(5%, -7%, 0) scale(1.1); }
  }

  .wrap { position: relative; z-index: 1; width: min(880px, 100%); }
  .head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 24px;
  }
  .kicker {
    margin: 0 0 8px;
    font-size: 11px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .head h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: .01em; }
  .hint {
    margin: 0;
    max-width: 22em;
    text-align: right;
    font-size: 12px;
    line-height: 1.7;
    color: var(--muted);
  }

  .deck {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
  }
  .glass {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 172px;
    padding: 20px;
    border-radius: var(--glass-radius);
    border: 1px solid rgba(255, 255, 255, .16);
    background: rgba(var(--glass-tint), var(--glass-alpha));
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(140%);
    backdrop-filter: blur(var(--glass-blur)) saturate(140%);
    box-shadow: 0 18px 40px rgba(4, 8, 20, .45), inset 0 1px 0 rgba(255, 255, 255, .26);
    transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .glass::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    border-radius: inherit;
    pointer-events: none;
    background: linear-gradient(140deg, rgba(255, 255, 255, .18) 0%, rgba(255, 255, 255, 0) 46%);
  }
  .glass > * { position: relative; z-index: 1; }
  .glass:hover {
    transform: translateY(-2px);
    border-color: rgba(94, 234, 212, .52);
    box-shadow: 0 22px 48px rgba(4, 8, 20, .52), inset 0 1px 0 rgba(255, 255, 255, .3);
  }
  .glass:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }
  .glass__top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .glass__tag { font-size: 12px; letter-spacing: .04em; color: #c8d2e6; }
  .glass__dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px rgba(94, 234, 212, .14);
  }
  .glass__value {
    font-size: 30px;
    font-weight: 600;
    line-height: 1.1;
    letter-spacing: -.01em;
  }
  .glass__value small { margin-left: 4px; font-size: 13px; font-weight: 400; color: var(--muted); }
  .glass__note { margin: 0; font-size: 12px; line-height: 1.7; color: #b6c1d6; }
  .glass__bar {
    margin-top: auto;
    height: 4px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .12);
    overflow: hidden;
  }
  .glass__bar span {
    display: block;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, rgba(94, 234, 212, .85), rgba(129, 140, 248, .85));
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 28px;
    margin-top: 22px;
    padding: 14px 16px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: rgba(20, 26, 46, .72);
  }
  .group { display: flex; align-items: center; gap: 8px; }
  .group__label { font-size: 12px; color: var(--muted); }
  .chip {
    padding: 5px 11px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, .14);
    background: rgba(255, 255, 255, .04);
    color: #c6d0e2;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    transition: color .15s ease, border-color .15s ease, background .15s ease;
  }
  .chip:hover { border-color: rgba(94, 234, 212, .4); color: var(--text); }
  .chip[aria-pressed="true"] {
    color: var(--accent);
    border-color: rgba(94, 234, 212, .55);
    background: rgba(94, 234, 212, .14);
  }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .foot {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    margin-top: 12px;
    font-size: 12px;
    color: var(--muted);
  }

  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .glass { background: rgba(20, 26, 46, .92); }
  }

  @media (max-width: 720px) {
    .deck { grid-template-columns: 1fr; }
    .head { flex-direction: column; align-items: flex-start; gap: 10px; }
    .hint { text-align: left; }
  }

  @media (prefers-reduced-motion: reduce) {html:not(.motion-force) .blob { animation: none; }html:not(.motion-force) .aurora { transition: none; transform: none; }html:not(.motion-force) .glass { transition: none; }html:not(.motion-force) .glass:hover { transform: none; }html:not(.motion-force) .chip { transition: none; }
  }
</style>
</head>
<body>
  <div class="aurora" id="aurora" aria-hidden="true">
    <span class="blob blob--a"></span>
    <span class="blob blob--b"></span>
    <span class="blob blob--c"></span>
  </div>

  <main class="wrap">
    <header class="head">
      <div>
        <p class="kicker">Surface / Glass</p>
        <h1>玻璃拟态</h1>
      </div>
      <p class="hint">移动指针，背景光斑会轻微偏移；悬停或用 Tab 聚焦卡片，再看玻璃后面的模糊变化。</p>
    </header>

    <div class="deck">
      <article class="glass" tabindex="0">
        <div class="glass__top">
          <span class="glass__tag">今日活跃</span>
          <span class="glass__dot" aria-hidden="true"></span>
        </div>
        <strong class="glass__value">12,480</strong>
        <p class="glass__note">较昨日 +8.2%，其中 62% 来自移动端</p>
        <div class="glass__bar" aria-hidden="true"><span style="width: 68%"></span></div>
      </article>

      <article class="glass" tabindex="0">
        <div class="glass__top">
          <span class="glass__tag">进行中项目</span>
          <span class="glass__dot" aria-hidden="true"></span>
        </div>
        <strong class="glass__value">3 <small>个</small></strong>
        <p class="glass__note">2 个等待评审，1 个正在灰度发布</p>
        <div class="glass__bar" aria-hidden="true"><span style="width: 45%"></span></div>
      </article>

      <article class="glass" tabindex="0">
        <div class="glass__top">
          <span class="glass__tag">本月用量</span>
          <span class="glass__dot" aria-hidden="true"></span>
        </div>
        <strong class="glass__value">68<small>%</small></strong>
        <p class="glass__note">额度还剩 32%，预计 9 天后触顶</p>
        <div class="glass__bar" aria-hidden="true"><span style="width: 68%"></span></div>
      </article>
    </div>

    <section class="controls" aria-label="玻璃参数演示">
      <div class="group">
        <span class="group__label">模糊半径</span>
        <button class="chip" type="button" data-group="blur" data-value="12" aria-pressed="false">12px</button>
        <button class="chip" type="button" data-group="blur" data-value="16" aria-pressed="true">16px</button>
        <button class="chip" type="button" data-group="blur" data-value="24" aria-pressed="false">24px</button>
      </div>
      <div class="group">
        <span class="group__label">底色不透明度</span>
        <button class="chip" type="button" data-group="alpha" data-value="0.08" aria-pressed="false">0.08</button>
        <button class="chip" type="button" data-group="alpha" data-value="0.12" aria-pressed="true">0.12</button>
        <button class="chip" type="button" data-group="alpha" data-value="0.2" aria-pressed="false">0.20</button>
      </div>
    </section>

    <div class="foot">
      <span>blur 16px · opacity 0.12 · radius 20px</span>
      <span>不支持背景模糊时回退为实色面板</span>
    </div>
  </main>

<script>
(() => {
  const root = document.documentElement
  const aurora = document.getElementById('aurora')
  const mq = window.matchMedia('(prefers-reduced-motion: reduce)')
  const chips = Array.prototype.slice.call(document.querySelectorAll('.chip'))
  const cleanups = []

  const setParam = (group, value) => {
    for (let i = 0; i < chips.length; i++) {
      const chip = chips[i]
      if (chip.dataset.group === group) {
        chip.setAttribute('aria-pressed', String(chip.dataset.value === value))
      }
    }
    if (group === 'blur') root.style.setProperty('--glass-blur', value + 'px')
    if (group === 'alpha') root.style.setProperty('--glass-alpha', value)
  }

  chips.forEach((chip) => {
    const onClick = () => setParam(chip.dataset.group, chip.dataset.value)
    chip.addEventListener('click', onClick)
    cleanups.push(() => chip.removeEventListener('click', onClick))
  })

  // 指针位移只写 CSS 变量，不读取布局，避免每帧强制重排
  const onMove = (e) => {
    if (mq.matches) return
    const dx = (e.clientX / window.innerWidth - 0.5) * 2
    const dy = (e.clientY / window.innerHeight - 0.5) * 2
    aurora.style.setProperty('--mx', (dx * 12).toFixed(2))
    aurora.style.setProperty('--my', (dy * 10).toFixed(2))
  }

  const onMotionChange = () => {
    if (mq.matches) {
      aurora.style.setProperty('--mx', '0')
      aurora.style.setProperty('--my', '0')
    }
  }

  window.addEventListener('pointermove', onMove, { passive: true })
  cleanups.push(() => window.removeEventListener('pointermove', onMove))
  mq.addEventListener('change', onMotionChange)
  cleanups.push(() => mq.removeEventListener('change', onMotionChange))

  const dispose = () => {
    while (cleanups.length) cleanups.pop()()
  }
  window.addEventListener('pagehide', dispose)
})()
</script>
</body>
</html>
