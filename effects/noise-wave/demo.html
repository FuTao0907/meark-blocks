<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>噪声波浪背景 · demo</title>
<style>
  :root {
    --bg: #0b1020;
    --card: #141a2e;
    --line: #22304d;
    --text: #e6ebf5;
    --muted: #8d9ab5;
    --accent: #5eead4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 40px 20px;
    background: radial-gradient(1000px 520px at 50% -15%, #1a2442 0%, var(--bg) 62%);
    color: var(--text);
    font-family: "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  }
  .wrap { width: min(760px, 100%); }
  .head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 14px;
  }
  .head h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: .02em; }
  .head p { margin: 0; font-size: 12px; color: var(--muted); }
  .stage {
    position: relative;
    height: 400px;
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
    background: linear-gradient(180deg, #101830 0%, #0a0f1e 72%);
    isolation: isolate;
  }
  .stage canvas {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .stage__veil {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(110% 92% at 22% 24%, rgba(11, 16, 32, .62) 0%, rgba(11, 16, 32, 0) 58%),
      linear-gradient(180deg, rgba(11, 16, 32, 0) 34%, rgba(11, 16, 32, .58) 100%);
  }
  .stage__copy {
    position: absolute;
    left: 28px;
    right: 28px;
    top: 74px;
    pointer-events: none;
  }
  .stage__kicker {
    margin: 0 0 12px;
    font-size: 11px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .stage__copy h2 {
    margin: 0 0 10px;
    font-size: clamp(26px, 4.2vw, 38px);
    line-height: 1.18;
    font-weight: 600;
  }
  .stage__copy .lead {
    margin: 0;
    max-width: 33em;
    font-size: 14px;
    line-height: 1.75;
    color: #b9c4da;
  }
  .stage__badge {
    position: absolute;
    right: 16px;
    top: 14px;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11px;
    color: var(--accent);
    background: rgba(94, 234, 212, .1);
    pointer-events: none;
  }
  .stage__hint {
    position: absolute;
    left: 28px;
    bottom: 16px;
    margin: 0;
    font-size: 12px;
    color: var(--muted);
    pointer-events: none;
  }
  .foot {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    margin-top: 12px;
    font-size: 12px;
    color: var(--muted);
  }
  @media (prefers-reduced-motion: reduce) {
    .stage__badge { background: rgba(94, 234, 212, .18); }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <h1>噪声波浪背景</h1>
      <p>ambient · canvas · 常驻漂移</p>
    </div>

    <section class="stage" id="stage">
      <canvas id="wave" aria-hidden="true"></canvas>
      <div class="stage__veil" aria-hidden="true"></div>
      <div class="stage__copy">
        <p class="stage__kicker">Ambient / Canvas</p>
        <h2>让背景持续地<br />缓慢起伏</h2>
        <p class="lead">四条正弦分量叠加的波浪在深色底色上错层漂移，作为落地页背景，前景文字始终保持可读。</p>
      </div>
      <span class="stage__badge">canvas · dpr 自适应</span>
      <p class="stage__hint">打开即运行，无需交互；背景层不接收指针事件</p>
    </section>

    <div class="foot">
      <span>amplitude 24 · speed 0.6 · lines 4</span>
      <span>减弱动态效果时静止为一帧</span>
    </div>
  </div>

<script>
(() => {
  const stage = document.getElementById('stage')
  const cv = document.getElementById('wave')
  const ctx = cv && cv.getContext('2d')
  const mq = window.matchMedia('(prefers-reduced-motion: reduce)')
  if (!ctx) return

  // 参数与噪声分量：初始化时固定，运行期不再新建
  const AMP = 24
  const SPEED = 0.6
  const LINES = 4
  const RGB = '94, 234, 212'
  const parts = [
    { f: 1.0, s: 0.34, p: 0.0, a: 0.52 },
    { f: 2.3, s: -0.51, p: 1.7, a: 0.28 },
    { f: 4.1, s: 0.79, p: 3.4, a: 0.14 },
    { f: 6.7, s: -1.11, p: 5.2, a: 0.08 }
  ]

  let w = 0
  let h = 0
  let dpr = 1
  let step = 6
  let raf = 0
  let running = false
  let last = 0
  let t = 0
  let fills = []
  let strokes = []

  const baseYFor = (layer) => {
    const k = LINES === 1 ? 1 : layer / (LINES - 1)
    return h * (0.42 + k * 0.19)
  }

  const waveAt = (x, layer, time) => {
    let sum = 0
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i]
      sum += p.a * Math.sin((x / w) * Math.PI * 2 * p.f + time * p.s + p.p + layer * 0.9)
    }
    // 越靠前的层振幅越大，与透明度递增配合形成纵深
    const depth = LINES === 1 ? 1 : 0.8 + (layer / (LINES - 1)) * 0.2
    return sum * AMP * depth
  }

  const buildPaint = () => {
    fills = []
    strokes = []
    for (let layer = 0; layer < LINES; layer++) {
      const k = LINES === 1 ? 1 : layer / (LINES - 1)
      const top = baseYFor(layer) - AMP * 1.8
      const g = ctx.createLinearGradient(0, top, 0, h)
      g.addColorStop(0, 'rgba(' + RGB + ', ' + (0.05 + k * 0.15).toFixed(3) + ')')
      g.addColorStop(1, 'rgba(' + RGB + ', 0.004)')
      fills.push(g)
      strokes.push('rgba(' + RGB + ', ' + (0.16 + k * 0.34).toFixed(3) + ')')
    }
  }

  const render = (time) => {
    ctx.clearRect(0, 0, w, h)
    for (let layer = 0; layer < LINES; layer++) {
      const baseY = baseYFor(layer)

      // 曲线向下闭合，填充为从曲线顶部到底部的渐隐块
      ctx.beginPath()
      ctx.moveTo(0, h)
      for (let x = 0; x <= w + step; x += step) {
        ctx.lineTo(x, baseY + waveAt(x, layer, time))
      }
      ctx.lineTo(w, h)
      ctx.closePath()
      ctx.fillStyle = fills[layer]
      ctx.fill()

      // 只描曲线上边缘，保留 1px 清晰轮廓
      ctx.beginPath()
      for (let x = 0; x <= w + step; x += step) {
        const y = baseY + waveAt(x, layer, time)
        if (x === 0) ctx.moveTo(x, y)
        else ctx.lineTo(x, y)
      }
      ctx.lineWidth = 1
      ctx.strokeStyle = strokes[layer]
      ctx.stroke()
    }
  }

  const resize = () => {
    if (!stage) return
    const r = stage.getBoundingClientRect()
    dpr = Math.min(window.devicePixelRatio || 1, 2)
    w = Math.max(1, r.width)
    h = Math.max(1, r.height)
    cv.width = Math.round(w * dpr)
    cv.height = Math.round(h * dpr)
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
    step = Math.max(4, Math.round(w / 150))
    buildPaint()
    render(t)
  }

  const frame = (now) => {
    if (!last) last = now
    const dt = Math.min(64, now - last)
    last = now
    t += (dt / 1000) * SPEED
    render(t)
    raf = requestAnimationFrame(frame)
  }

  const start = () => {
    if (running || mq.matches) return
    running = true
    last = 0
    raf = requestAnimationFrame(frame)
  }

  const stop = () => {
    if (raf) cancelAnimationFrame(raf)
    raf = 0
    running = false
    last = 0
  }

  const onVisibility = () => {
    if (document.hidden) stop()
    else start()
  }

  const onMotionChange = () => {
    if (mq.matches) {
      stop()
      render(0)
    } else {
      start()
    }
  }

  const dispose = () => {
    stop()
    window.removeEventListener('resize', resize)
    document.removeEventListener('visibilitychange', onVisibility)
    mq.removeEventListener('change', onMotionChange)
    window.removeEventListener('pagehide', dispose)
  }

  window.addEventListener('resize', resize)
  document.addEventListener('visibilitychange', onVisibility)
  mq.addEventListener('change', onMotionChange)
  window.addEventListener('pagehide', dispose)

  resize()
  start()
})()
</script>
</body>
</html>
