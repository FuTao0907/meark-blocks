<!doctype html>
<html lang="zh-CN">
<head>
<script>
  // 演示模式：?motion=1 时忽略系统「减少动态效果」，方便查看完整效果；默认遵循系统设置
  (function () {
    var force = new URLSearchParams(location.search).get('motion') === '1'
    if (!force) return
    document.documentElement.classList.add('motion-force')
    var nativeMatchMedia = window.matchMedia.bind(window)
    window.matchMedia = function (query) {
      if (/prefers-reduced-motion/.test(query)) {
        return {
          matches: false,
          media: query,
          onchange: null,
          addEventListener: function () {},
          removeEventListener: function () {},
          addListener: function () {},
          removeListener: function () {},
          dispatchEvent: function () { return false }
        }
      }
      return nativeMatchMedia(query)
    }
  })()
</script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../shared/base.css" />
<title>噪点纹理 · demo</title>
<style>
  
  * { box-sizing: border-box; }body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 40px 20px;
}
  .wrap { width: min(860px, 100%); }
  .head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 16px;
  }
  .kicker {
    margin: 0 0 8px;
    font-size: 11px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .head h1 { margin: 0; font-size: 22px; font-weight: 600; }
  .hint {
    margin: 0;
    max-width: 24em;
    text-align: right;
    font-size: 12px;
    line-height: 1.7;
    color: var(--muted);
  }

  .frame {
    position: relative;
    height: 400px;
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
    background: #0d1324;
    isolation: isolate;
  }
  .frame__art {
    position: absolute;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(620px 320px at 80% 14%, rgba(94, 234, 212, .2), transparent 62%),
      radial-gradient(520px 340px at 12% 96%, rgba(124, 58, 237, .34), transparent 64%),
      linear-gradient(152deg, #1c2544 0%, #0c1120 64%);
  }
  .orb {
    position: absolute;
    display: block;
    border-radius: 50%;
  }
  .orb--a {
    width: 240px; height: 240px;
    right: 7%; top: 12%;
    background: conic-gradient(from 200deg, #5eead4, #6366f1, #a855f7, #22d3ee, #5eead4);
    filter: blur(1px);
    opacity: .8;
  }
  .orb--b {
    width: 150px; height: 150px;
    right: 24%; top: 40%;
    border: 1px solid rgba(230, 235, 245, .35);
    backdrop-filter: blur(2px);
  }
  .orb--c {
    width: 8px; height: 8px;
    right: 40%; top: 22%;
    background: #5eead4;
    box-shadow: 0 0 0 6px rgba(94, 234, 212, .16);
  }
  #grain {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: block;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .frame__copy {
    position: absolute;
    z-index: 2;
    left: 30px;
    right: 46%;
    top: 46px;
  }
  .frame__meta {
    margin: 0 0 14px;
    font-size: 11px;
    letter-spacing: .22em;
    color: rgba(230, 235, 245, .62);
  }
  .frame__copy h2 {
    margin: 0 0 14px;
    font-size: clamp(24px, 3.4vw, 32px);
    line-height: 1.28;
    font-weight: 600;
  }
  .frame__body {
    margin: 0;
    max-width: 24em;
    font-size: 13px;
    line-height: 1.8;
    color: #b6c1d6;
  }
  .frame__caption {
    position: absolute;
    z-index: 2;
    left: 30px;
    bottom: 20px;
    margin: 0;
    font-size: 12px;
    color: var(--muted);
  }
  .frame__badge {
    position: absolute;
    z-index: 2;
    right: 16px;
    top: 14px;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11px;
    color: var(--accent);
    background: rgba(11, 16, 32, .55);
    border: 1px solid rgba(94, 234, 212, .28);
  }

  .panel {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px 28px;
    margin-top: 14px;
    padding: 18px 20px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--card);
  }
  .field { display: grid; grid-template-columns: 1fr auto; gap: 8px 10px; align-items: center; }
  .field label { font-size: 13px; color: #cdd6e6; }
  .field output {
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
  }
  .field input[type="range"] {
    grid-column: 1 / -1;
    width: 100%;
    height: 22px;
    margin: 0;
    accent-color: var(--accent);
    background: transparent;
    cursor: pointer;
  }
  .field input[type="range"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .foot {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    margin-top: 12px;
    font-size: 12px;
    color: var(--muted);
  }

  @media (max-width: 640px) {
    .frame { height: 440px; }
    .frame__copy { right: 30px; top: 34px; }
    .panel { grid-template-columns: 1fr; }
    .head { flex-direction: column; align-items: flex-start; gap: 10px; }
    .hint { text-align: left; }
  }

  @media (prefers-reduced-motion: reduce) {html:not(.motion-force) .orb--a { filter: none; }html:not(.motion-force) .field input[type="range"] { cursor: default; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="head">
      <div>
        <p class="kicker">Texture / Grain</p>
        <h1>噪点纹理</h1>
      </div>
      <p class="hint">拖动下方滑块调整颗粒密度与整体不透明度，观察同一画面在细颗粒下的变化。</p>
    </header>

    <section class="frame" id="preview" aria-label="噪点纹理效果预览">
      <div class="frame__art" aria-hidden="true">
        <span class="orb orb--a"></span>
        <span class="orb orb--b"></span>
        <span class="orb orb--c"></span>
      </div>
      <canvas id="grain" aria-hidden="true"></canvas>
      <div class="frame__copy">
        <p class="frame__meta">PORTFOLIO / 2026</p>
        <h2>颗粒让深色<br />不再扁平</h2>
        <p class="frame__body">细颗粒均匀铺在画面上，削弱大面积纯色的塑料感；静止时像印刷品，轻微闪动时像胶片。</p>
      </div>
      <p class="frame__caption">作品封面 / 海报底纹 / 深色区块</p>
      <span class="frame__badge">noise · 1px · canvas</span>
    </section>

    <section class="panel" aria-label="噪点参数">
      <div class="field">
        <label for="density">颗粒密度</label>
        <output id="densityOut" for="density">0.35</output>
        <input id="density" type="range" min="5" max="80" step="1" value="35" />
      </div>
      <div class="field">
        <label for="opacity">不透明度</label>
        <output id="opacityOut" for="opacity">0.06</output>
        <input id="opacity" type="range" min="3" max="15" step="1" value="6" />
      </div>
    </section>

    <div class="foot">
      <span>grain 1px · ~12fps 位移 · 平铺图案</span>
      <span>减弱动态效果时颗粒静止</span>
    </div>
  </div>

<script>
(() => {
  const host = document.getElementById('preview')
  const cv = document.getElementById('grain')
  const ctx = cv && cv.getContext('2d')
  const densityEl = document.getElementById('density')
  const opacityEl = document.getElementById('opacity')
  const densityOut = document.getElementById('densityOut')
  const opacityOut = document.getElementById('opacityOut')
  const mq = window.matchMedia('(prefers-reduced-motion: reduce)')
  if (!ctx) return

  const TILE = 160
  const tint = [255, 255, 255]
  const tile = document.createElement('canvas')
  tile.width = TILE
  tile.height = TILE
  const tctx = tile.getContext('2d')

  let density = 0.35
  let alpha = 0.06
  let pattern = null
  let w = 0
  let h = 0
  let dpr = 1
  let raf = 0
  let running = false
  let last = 0
  const cleanups = []

  // 噪点只生成一次到离屏画布，运行期仅平铺与位移；1 个颗粒占 1 个 CSS 像素
  const buildTile = () => {
    const img = tctx.createImageData(TILE, TILE)
    const d = img.data
    for (let i = 0; i < d.length; i += 4) {
      d[i] = tint[0]
      d[i + 1] = tint[1]
      d[i + 2] = tint[2]
      d[i + 3] = Math.random() < density ? 40 + Math.random() * 215 : 0
    }
    tctx.putImageData(img, 0, 0)
    pattern = ctx.createPattern(tile, 'repeat')
  }

  // 画布 backing store 按设备像素比放大，绘制坐标用 CSS 像素，颗粒因此恒定 1 CSS 像素
  const paint = (jitter) => {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
    ctx.imageSmoothingEnabled = false
    ctx.clearRect(0, 0, w, h)
    if (!pattern) return
    const ox = jitter ? -((Math.random() * TILE) | 0) : 0
    const oy = jitter ? -((Math.random() * TILE) | 0) : 0
    ctx.globalAlpha = alpha
    ctx.fillStyle = pattern
    ctx.save()
    ctx.translate(ox, oy)
    ctx.fillRect(0, 0, w + TILE, h + TILE)
    ctx.restore()
    ctx.globalAlpha = 1
  }

  const frame = (now) => {
    raf = requestAnimationFrame(frame)
    if (now - last < 80) return
    last = now
    paint(true)
  }

  const start = () => {
    if (running || mq.matches) return
    running = true
    last = 0
    raf = requestAnimationFrame(frame)
  }

  const stop = () => {
    if (raf) cancelAnimationFrame(raf)
    raf = 0
    running = false
    last = 0
  }

  const resize = () => {
    const r = host.getBoundingClientRect()
    dpr = Math.min(window.devicePixelRatio || 1, 2)
    w = Math.max(1, r.width)
    h = Math.max(1, r.height)
    cv.width = Math.max(1, Math.round(w * dpr))
    cv.height = Math.max(1, Math.round(h * dpr))
    paint(false)
  }

  const onDensity = () => {
    density = Number(densityEl.value) / 100
    densityOut.textContent = density.toFixed(2)
    buildTile()
    paint(false)
  }

  const onOpacity = () => {
    alpha = Number(opacityEl.value) / 100
    opacityOut.textContent = alpha.toFixed(2)
    paint(false)
  }

  const onVisibility = () => {
    if (document.hidden) stop()
    else start()
  }

  const onMotionChange = () => {
    if (mq.matches) {
      stop()
      paint(false)
    } else {
      start()
    }
  }

  const bind = (el, type, fn) => {
    el.addEventListener(type, fn)
    cleanups.push(() => el.removeEventListener(type, fn))
  }

  bind(densityEl, 'input', onDensity)
  bind(opacityEl, 'input', onOpacity)
  bind(window, 'resize', resize)
  bind(document, 'visibilitychange', onVisibility)
  bind(mq, 'change', onMotionChange)

  const dispose = () => {
    stop()
    while (cleanups.length) cleanups.pop()()
    window.removeEventListener('pagehide', dispose)
  }
  window.addEventListener('pagehide', dispose)

  buildTile()
  resize()
  start()
})()
</script>
</body>
</html>
