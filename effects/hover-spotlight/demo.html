<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>光斑跟随卡片 · demo</title>
<style>
  :root {
    --bg: #0b1020;
    --card: #141a2e;
    --line: #26304d;
    --text: #e6ebf5;
    --muted: #8d9ab5;
    --accent: #5eead4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 48px 20px;
    background: radial-gradient(900px 500px at 50% -10%, #1b2540 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 220px)); gap: 18px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }

  .card {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    padding: 22px 20px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--card);
    transition: border-color 200ms ease;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 200ms ease;
    background: radial-gradient(
      var(--glow-size, 320px) circle at var(--mx, 50%) var(--my, 50%),
      rgba(255, 240, 214, var(--glow-opacity, 0.15)),
      transparent 70%
    );
  }
  .card:hover::before { opacity: 1; }
  .card__body { position: relative; z-index: 1; }
  .card h2 { margin: 0 0 8px; font-size: 16px; }
  .card p { margin: 0; font-size: 13px; line-height: 1.7; color: var(--muted); }
  .card__tag {
    display: inline-block;
    margin-bottom: 14px;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    color: var(--accent);
    background: rgba(94, 234, 212, 0.1);
  }
  .card:focus-visible {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(94, 234, 212, 0.25);
  }

  @media (prefers-reduced-motion: reduce) {
    .card::before { display: none; }
    .card:focus-visible, .card:hover { border-color: var(--accent); }
  }
</style>
</head>
<body>
  <div class="grid">
    <article class="card" tabindex="0">
      <div class="card__body">
        <span class="card__tag">交互</span>
        <h2>跟随光斑</h2>
        <p>指针在卡片内移动时，暖白光斑跟随并轻微延迟，形成柔和拖尾。</p>
      </div>
    </article>
    <article class="card" tabindex="0">
      <div class="card__body">
        <span class="card__tag">交互</span>
        <h2>注意力引导</h2>
        <p>适合特性介绍、价格方案、作品集。键盘聚焦时退化为边框高亮。</p>
      </div>
    </article>
    <article class="card" tabindex="0">
      <div class="card__body">
        <span class="card__tag">交互</span>
        <h2>克制的动效</h2>
        <p>只使用渐变与透明度，不改变布局，不影响文字选中与点击。</p>
      </div>
    </article>
  </div>

<script>
(() => {
  const cards = document.querySelectorAll('.card')
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches
  if (reduce) return

  cards.forEach((card) => {
    let raf = 0
    let targetX = 50, targetY = 50
    let curX = 50, curY = 50

    const tick = () => {
      curX += (targetX - curX) * 0.18
      curY += (targetY - curY) * 0.18
      card.style.setProperty('--mx', curX + '%')
      card.style.setProperty('--my', curY + '%')
      if (Math.abs(targetX - curX) > 0.1 || Math.abs(targetY - curY) > 0.1) {
        raf = requestAnimationFrame(tick)
      } else {
        raf = 0
      }
    }

    const onMove = (e) => {
      const r = card.getBoundingClientRect()
      targetX = ((e.clientX - r.left) / r.width) * 100
      targetY = ((e.clientY - r.top) / r.height) * 100
      if (!raf) raf = requestAnimationFrame(tick)
    }

    card.addEventListener('pointermove', onMove)
    card.addEventListener('pointerleave', () => {
      if (raf) cancelAnimationFrame(raf)
      raf = 0
      card.style.setProperty('--mx', '50%')
      card.style.setProperty('--my', '50%')
    })
  })
})()
</script>
</body>
</html>
